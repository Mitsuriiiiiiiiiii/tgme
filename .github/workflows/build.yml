name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build APK release signé
        run: ./gradlew assembleRelease --stacktrace

      - name: Vérifier les ABI (32 + 64 bit)
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep 'lib/' || true
          for a in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$a/" || { echo "::error::ABI manquante: $a"; exit 1; }
          done

      - name: Debug outputs
        if: always()
        run: find app/build/outputs -type f | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: tgme-apk
          path: app/build/outputs/apk/release/*.apk
